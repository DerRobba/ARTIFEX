[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifex"
version = "0.1.0"
description = "ARTIFEX printer host software: AI text-to-print pipeline, in-house slicer, Klipper/Moonraker bridge and touch UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved" }
authors = [{ name = "Malte, Leo and Bo" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "shapely>=2.0",
    "networkx>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
artifex = "artifex.__main__:main"

[tool.setuptools.packages.find]
include = ["artifex*"]

[tool.setuptools.package-data]
artifex = ["web/*", "pipeline/templates/*.scad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
