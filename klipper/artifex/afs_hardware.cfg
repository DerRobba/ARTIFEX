# =============================================================================
#  AFS hardware – motorised magnetic filament modules on a second MCU
#
#  Reference build: Raspberry Pi Pico (RP2040) flashed with Klipper, one
#  TMC2209/A4988 stepper driver + NEMA17/NEMA14 feeder per module, hall-sensor
#  per module dock and one filament sensor in the hub (Y-merger).
#  All pins below are placeholders  >>> ADAPT TO YOUR WIRING <<<
#
#  Including this file switches the AFS macros into hardware mode.
# =============================================================================

[mcu afs]
serial: /dev/serial/by-id/usb-Klipper_rp2040_AFS_REPLACE_ME-if00
restart_method: command

[gcode_macro _AFS]
variable_hardware: True

[manual_stepper afs_feeder_0]
step_pin: afs:gpio2
dir_pin: afs:gpio3
enable_pin: !afs:gpio4
microsteps: 16
rotation_distance: 22.6789511   # >>> CALIBRATE <<< feeder gear
velocity: 60
accel: 400

[manual_stepper afs_feeder_1]
step_pin: afs:gpio6
dir_pin: afs:gpio7
enable_pin: !afs:gpio8
microsteps: 16
rotation_distance: 22.6789511
velocity: 60
accel: 400

[manual_stepper afs_feeder_2]
step_pin: afs:gpio10
dir_pin: afs:gpio11
enable_pin: !afs:gpio12
microsteps: 16
rotation_distance: 22.6789511
velocity: 60
accel: 400

[manual_stepper afs_feeder_3]
step_pin: afs:gpio14
dir_pin: afs:gpio15
enable_pin: !afs:gpio16
microsteps: 16
rotation_distance: 22.6789511
velocity: 60
accel: 400

# Hub sensor: tells whether any filament is inside the shared path.
[filament_switch_sensor afs_hub]
switch_pin: ^afs:gpio26
pause_on_runout: False

[gcode_macro _AFS_UNLOAD_HW]
description: Retract the active filament back into its module
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% if afs.current >= 0 %}
    {% set s = "afs_feeder_%d" % afs.current %}
    _AFS_TIP
    MANUAL_STEPPER STEPPER={s} ENABLE=1 SET_POSITION=0
    # leave the extruder gears with feeder + extruder in sync
    MANUAL_STEPPER STEPPER={s} MOVE=-{afs.toolhead_length} SPEED=20 SYNC=0
    M83
    G1 E-{afs.toolhead_length} F1200
    M400
    # pull back through the bowden into the module
    MANUAL_STEPPER STEPPER={s} MOVE=-{afs.toolhead_length + afs.bowden_length} SPEED=60
    MANUAL_STEPPER STEPPER={s} ENABLE=0
    {% if printer["filament_switch_sensor afs_hub"].filament_detected %}
      { action_raise_error("AFS: Filament hängt noch im Hub!") }
    {% endif %}
  {% endif %}

[gcode_macro _AFS_LOAD_HW]
description: Feed a slot from its module into the toolhead. SLOT=n
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% set s = "afs_feeder_%d" % (params.SLOT|int) %}
  MANUAL_STEPPER STEPPER={s} ENABLE=1 SET_POSITION=0
  MANUAL_STEPPER STEPPER={s} MOVE={afs.bowden_length} SPEED=60
  # last part together with the extruder
  MANUAL_STEPPER STEPPER={s} MOVE={afs.bowden_length + afs.toolhead_length} SPEED=10 SYNC=0
  M83
  G1 E{afs.toolhead_length} F600
  M400
  MANUAL_STEPPER STEPPER={s} ENABLE=0
