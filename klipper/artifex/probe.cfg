# BLTouch (or clone) as Z endstop + automatic bed mesh.
# Use INSTEAD of z_switch.cfg.   >>> CALIBRATE <<< offsets with PROBE_CALIBRATE.
[bltouch]
sensor_pin: ^gpio22
control_pin: gpio29
x_offset: -38
y_offset: -8
#z_offset: 2.0               # set by PROBE_CALIBRATE + SAVE_CONFIG
speed: 5
samples: 2
sample_retract_dist: 3

[stepper_z]
endstop_pin: probe:z_virtual_endstop

[safe_z_home]
home_xy_position: 155.5, 125.5   # bed centre + probe offset
speed: 150
z_hop: 8
z_hop_speed: 10

[bed_mesh]
speed: 180
horizontal_move_z: 4
mesh_min: 12, 12
mesh_max: 192, 222
probe_count: 6, 6
algorithm: bicubic
fade_start: 1
fade_end: 10
