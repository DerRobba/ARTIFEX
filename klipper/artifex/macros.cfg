# =============================================================================
#  ARTIFEX core macros – called by the ARTIFEX slicer / host software
# =============================================================================

[gcode_macro _ARTIFEX]
description: Machine-wide settings used by the macros
variable_park_x: 117.5          # parking / presentation position
variable_park_y: 225.0
variable_park_lift: 30          # mm the bed lowers when parking
variable_purge_x: 4.0           # purge line along the left bed edge (outside print margin)
variable_purge_y_start: 20.0
variable_purge_y_end: 120.0
variable_pause_retract: 1.0
gcode:
  RESPOND MSG="ARTIFEX macros loaded"

# ---------------------------------------------------------------- print start
[gcode_macro PRINT_START]
description: Heat, home, mesh, select AFS slot and purge. Params: BED EXTRUDER SLOT MATERIAL FILTER
gcode:
  {% set BED = params.BED|default(60)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(210)|float %}
  {% set SLOT = params.SLOT|default(-1)|int %}
  {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
  {% set FILTER = params.FILTER|default(-1)|int %}
  {% set afs = printer["gcode_macro _AFS"] %}
  CLEAR_PAUSE
  {% if "bed_mesh" in printer %}
    BED_MESH_CLEAR
  {% endif %}
  _ARTIFEX_LED STATE=heating
  M117 Heize auf ({MATERIAL})
  M140 S{BED}
  M104 S150                       ; warm the nozzle without oozing
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  _FILTER_AUTO MATERIAL={MATERIAL} MODE={FILTER}
  G90
  G1 Z10 F900
  G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F9000
  M190 S{BED}
  {% if "probe" in printer %}
    M117 Vermesse Bett
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% endif %}
  M109 S{EXTRUDER}
  {% if SLOT >= 0 and SLOT != afs.current %}
    # Filament change needed. Hardware AFS: loads + purges now.
    # Manual mode: pauses, the display asks the user to insert the filament,
    # AFS_LOAD_CONFIRM loads + purges and resumes the print.
    AFS_CHANGE SLOT={SLOT} TEMP={EXTRUDER}
  {% else %}
    _PURGE_LINE
  {% endif %}
  _ARTIFEX_LED STATE=printing
  M117 Druckt

[gcode_macro _PURGE_LINE]
description: Prime the nozzle with a double line along the left bed edge
gcode:
  {% set a = printer["gcode_macro _ARTIFEX"] %}
  SAVE_GCODE_STATE NAME=purge
  G90
  M83
  G1 Z5 F900
  G1 X{a.purge_x} Y{a.purge_y_start} F9000
  G1 Z0.3 F600
  G1 Y{a.purge_y_end} E{(a.purge_y_end - a.purge_y_start) * 0.12} F1500
  G1 X{a.purge_x + 0.6} F3000
  G1 Y{a.purge_y_start} E{(a.purge_y_end - a.purge_y_start) * 0.08} F2000
  G1 E-0.5 F2100
  G1 Z1.0 F900
  RESTORE_GCODE_STATE NAME=purge

# ---------------------------------------------------------------- print end
[gcode_macro PRINT_END]
description: Retract, present the print, heaters off, filter run-on
gcode:
  {% set a = printer["gcode_macro _ARTIFEX"] %}
  M400
  M83
  G1 E-2 F2400
  _ARTIFEX_PARK
  TURN_OFF_HEATERS
  M107
  _FILTER_RUNOUT
  M84 X Y E
  _ARTIFEX_LED STATE=done
  M117 Druck fertig

# ---------------------------------------------------------------- park
[gcode_macro _ARTIFEX_PARK]
description: Move the head to the parking position and lower the bed
gcode:
  {% set a = printer["gcode_macro _ARTIFEX"] %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set X = params.X|default(a.park_x)|float %}
  {% set Y = params.Y|default(a.park_y)|float %}
  {% set LIFT = params.LIFT|default(a.park_lift)|float %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
      { action_raise_error("ARTIFEX: cannot park - printer not homed") }
    {% endif %}
    G28
  {% endif %}
  # X/Y/Z are machine coordinates; the active tool offset (SET_GCODE_OFFSET) is
  # subtracted so the move always stays inside the axis limits.
  {% set ho = printer.gcode_move.homing_origin %}
  {% set tk = printer.toolhead %}
  {% set mz = [tk.position.z + LIFT, max_z - 2]|min %}
  {% set mx = [[X, tk.axis_minimum.x]|max, tk.axis_maximum.x]|min %}
  {% set my = [[Y, tk.axis_minimum.y]|max, tk.axis_maximum.y]|min %}
  SAVE_GCODE_STATE NAME=park
  G90
  G1 Z{[mz - ho.z, tk.axis_maximum.z - ho.z]|min} F900
  G1 X{[mx - ho.x, tk.axis_maximum.x - ho.x]|min} Y{[my - ho.y, tk.axis_maximum.y - ho.y]|min} F9000
  RESTORE_GCODE_STATE NAME=park

# ---------------------------------------------------------------- pause / resume / cancel
[gcode_macro PAUSE]
description: Pause the print and park the head
rename_existing: BASE_PAUSE
gcode:
  {% set a = printer["gcode_macro _ARTIFEX"] %}
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Druck ist bereits pausiert"
  {% else %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE={printer.extruder.target}
    BASE_PAUSE
    {% if printer.extruder.can_extrude %}
      M83
      G1 E-{a.pause_retract} F2100
    {% endif %}
    _ARTIFEX_PARK
    _ARTIFEX_LED STATE=paused
  {% endif %}

[gcode_macro RESUME]
description: Re-heat if needed and continue the print
rename_existing: BASE_RESUME
variable_last_extruder_temp: 0
gcode:
  {% set a = printer["gcode_macro _ARTIFEX"] %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND MSG="Druck ist nicht pausiert"
  {% else %}
    {% if last_extruder_temp > 0 and printer.extruder.target < last_extruder_temp %}
      M109 S{last_extruder_temp}
    {% endif %}
    {% if printer.extruder.can_extrude %}
      M83
      G1 E{a.pause_retract} F2100
    {% endif %}
    _ARTIFEX_LED STATE=printing
    M117 Druckt
    BASE_RESUME
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the print, park and cool down
rename_existing: BASE_CANCEL_PRINT
gcode:
  TURN_OFF_HEATERS
  M107
  CLEAR_PAUSE
  {% if printer.toolhead.homed_axes == "xyz" %}
    _ARTIFEX_PARK
  {% endif %}
  _FILTER_RUNOUT
  SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=pending VALUE=-1
  _ARTIFEX_LED STATE=idle
  M117 Abgebrochen
  BASE_CANCEL_PRINT

# Classic filament change command (e.g. from other slicers) -> guided swap of the
# active AFS slot.
[gcode_macro M600]
description: Filament change (same AFS slot)
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  AFS_CHANGE SLOT={[afs.current, 0]|max} FORCE=1

# ---------------------------------------------------------------- status LEDs
[gcode_macro _ARTIFEX_LED]
description: Status colour on the LED strip. STATE=idle|heating|printing|paused|done|error
gcode:
  {% set s = params.STATE|default("idle")|lower %}
  {% set colors = {
      "idle": (0.25, 0.12, 0.02),
      "heating": (1.0, 0.35, 0.0),
      "printing": (0.9, 0.9, 0.9),
      "paused": (1.0, 0.8, 0.0),
      "done": (0.0, 1.0, 0.2),
      "error": (1.0, 0.0, 0.0)} %}
  {% set c = colors[s] if s in colors else colors["idle"] %}
  {% if "neopixel artifex_led" in printer %}
    SET_LED LED=artifex_led RED={c[0]} GREEN={c[1]} BLUE={c[2]}
  {% endif %}

# ---------------------------------------------------------------- startup
[delayed_gcode _ARTIFEX_INIT]
initial_duration: 1
gcode:
  {% set sv = printer.save_variables.variables %}
  {% if "afs_current" in sv %}
    SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=current VALUE={sv.afs_current}
  {% endif %}
  {% if "toolhead" in sv %}
    _TOOLHEAD_RESTORE TOOL={sv.toolhead}
  {% endif %}
  _ARTIFEX_LED STATE=idle
