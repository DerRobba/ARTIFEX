# Optional sensors.

# Filament runout at the toolhead (E0-STOP port). Triggers a guided swap (M600).
[filament_switch_sensor toolhead_filament]
switch_pin: ^gpio16
pause_on_runout: True
runout_gcode:
  M117 Filament leer!
  _AFS_RUNOUT
insert_gcode:
  M117 Filament erkannt

