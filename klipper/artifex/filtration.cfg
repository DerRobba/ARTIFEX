# =============================================================================
#  HEPA + activated carbon (ACF) filtration – fan on FAN3 (gpio20)
#  Runs automatically for ABS/ASA/PC/PA and keeps running after the print to
#  clear the enclosure.
# =============================================================================

[fan_generic filter_fan]
pin: gpio20
max_power: 1.0
kick_start_time: 0.5
off_below: 0.15

[gcode_macro _FILTER]
variable_auto_materials: ["ABS", "ASA", "PC", "PA", "NYLON", "HIPS"]
variable_runout_s: 600
variable_default_speed: 0.8
gcode:

[gcode_macro FILTER_ON]
description: Switch the HEPA/ACF filter on. [SPEED=0..1]
gcode:
  {% set f = printer["gcode_macro _FILTER"] %}
  UPDATE_DELAYED_GCODE ID=_FILTER_OFF_TIMER DURATION=0
  SET_FAN_SPEED FAN=filter_fan SPEED={params.SPEED|default(f.default_speed)|float}

[gcode_macro FILTER_OFF]
description: Switch the filter off
gcode:
  UPDATE_DELAYED_GCODE ID=_FILTER_OFF_TIMER DURATION=0
  SET_FAN_SPEED FAN=filter_fan SPEED=0

[gcode_macro _FILTER_AUTO]
description: MATERIAL=<type> MODE=-1(auto)|0(off)|1(on)
gcode:
  {% set f = printer["gcode_macro _FILTER"] %}
  {% set mode = params.MODE|default(-1)|int %}
  {% set mat = params.MATERIAL|default("PLA")|upper %}
  {% if mode == 1 or (mode == -1 and mat in f.auto_materials) %}
    FILTER_ON
  {% elif mode == 0 %}
    FILTER_OFF
  {% endif %}

[gcode_macro _FILTER_RUNOUT]
description: Keep the filter running for a while after a print
gcode:
  {% set f = printer["gcode_macro _FILTER"] %}
  {% if printer["fan_generic filter_fan"].speed > 0 %}
    UPDATE_DELAYED_GCODE ID=_FILTER_OFF_TIMER DURATION={f.runout_s}
  {% endif %}

[delayed_gcode _FILTER_OFF_TIMER]
gcode:
  SET_FAN_SPEED FAN=filter_fan SPEED=0
