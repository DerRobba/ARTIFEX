# =============================================================================
#  ARTIFEX hardware – BTT SKR Pico (RP2040, 4x TMC2209 via single-wire UART)
#  Pinout follows Klipper's generic-bigtreetech-skr-pico-v1.0.cfg.
#
#  Motor ports:  X = stepper A (CoreXY), Y = stepper B (CoreXY),
#                Z = bed (both Z ports are driven by the same driver),
#                E = direct-drive extruder
# =============================================================================

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40          # GT2 belt, 20T pulley
endstop_pin: ^gpio4
position_endstop: 235          # >>> CALIBRATE <<< homes to X max (right)
position_min: 0
position_max: 235
homing_speed: 60
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.8
stealthchop_threshold: 0

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 235          # >>> CALIBRATE <<< homes to Y max (back)
position_min: 0
position_max: 235
homing_speed: 60
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.8
stealthchop_threshold: 0

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8           # T8 lead screw (8 mm lead)
# endstop_pin / position_endstop come from z_switch.cfg OR probe.cfg (include one)
position_min: -2
position_max: 250              # >>> CALIBRATE <<< usable Z travel of the frame
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.8
stealthchop_threshold: 999999  # quiet bed movement

# --- E3D V6 hotend + direct drive -------------------------------------------
[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
# >>> CALIBRATE <<< value for a BMG-style dual-gear extruder (3:1 ≈ 50:17)
rotation_distance: 22.6789511
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150     # AFS load/unload moves
max_extrude_cross_section: 5
pressure_advance: 0.04             # >>> CALIBRATE <<<
pressure_advance_smooth_time: 0.040
heater_pin: gpio23
sensor_pin: gpio27
# E3D V6 cartridge thermistor (older kits: "ATC Semitec 104GT-2")
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid                       # >>> CALIBRATE <<< PID_CALIBRATE HEATER=extruder TARGET=220
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 285
min_extrude_temp: 170

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.55
stealthchop_threshold: 0

# --- Ender-3 heated bed (moves only in Z) -------------------------------------
[heater_bed]
heater_pin: gpio21
sensor_pin: gpio26
sensor_type: EPCOS 100K B57560G104F
control: pid                       # >>> CALIBRATE <<< PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 115

# --- fans ---------------------------------------------------------------------
[fan]                              # part cooling (FAN1)
pin: gpio17
kick_start_time: 0.3

[heater_fan hotend_fan]            # E3D V6 heatsink fan (FAN2)
pin: gpio18
heater: extruder
heater_temp: 50.0

# FAN3 (gpio20) drives the HEPA + ACF filter – see filtration.cfg

# --- status LED (optional RGB strip on the RGB port) --------------------------
[neopixel artifex_led]
pin: gpio24
chain_count: 12
color_order: GRB
initial_RED: 0.2
initial_GREEN: 0.1
initial_BLUE: 0.0

[force_move]
enable_force_move: True
