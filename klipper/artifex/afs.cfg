# =============================================================================
#  ARTIFEX Filament System (AFS) – multi-material / colour changes
#
#  Two operating modes, same G-code interface:
#   * manual   (default): ARTIFEX unloads, parks and asks on the display for the
#                         new filament; AFS_LOAD_CONFIRM loads, purges, resumes.
#   * hardware          : include afs_hardware.cfg – motorised magnetic modules
#                         feed/retract the filament automatically.
#
#  Interface used by the slicer / host:
#   AFS_CHANGE SLOT=n [TEMP=t]   switch to slot n (mid-print colour change too)
#   AFS_LOAD SLOT=n [TEMP=t]     load slot n into the toolhead
#   AFS_UNLOAD [TEMP=t]          unload the active filament
#   AFS_LOAD_CONFIRM             (manual mode) the user has inserted the filament
#   AFS_STATUS
# =============================================================================

[gcode_macro _AFS]
description: AFS state and parameters
variable_slots: 4
variable_hardware: False
variable_current: -1            # slot currently in the toolhead (-1 = unknown)
variable_pending: -1            # manual mode: slot the user has to insert
variable_resume_after_load: False
variable_default_temp: 220
variable_unload_length: 90      # mm to pull the filament out of the direct drive
variable_load_length: 70        # mm from extruder gears to nozzle (manual mode)
variable_purge_length: 60       # mm purged after a colour change
variable_toolhead_length: 70    # hardware: extruder gears -> nozzle
variable_bowden_length: 650     # hardware: AFS module -> extruder gears
gcode:
  AFS_STATUS

[gcode_macro AFS_STATUS]
description: Print the AFS state
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  RESPOND MSG="AFS: {'Hardware' if afs.hardware else 'manuell'} | Slot aktiv: {afs.current + 1 if afs.current >= 0 else '-'} | wartet auf: {afs.pending + 1 if afs.pending >= 0 else '-'}"

[gcode_macro _AFS_HEAT]
description: Make sure the nozzle is hot enough to move filament
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% set t = params.TEMP|default(0)|float %}
  {% set t = t if t > 0 else ([printer.extruder.target, afs.default_temp]|max) %}
  {% if printer.extruder.target < t %}
    M117 Heize Düse für Filamentwechsel
    M104 S{t}
  {% endif %}
  {% if printer.extruder.temperature < t - 5 %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t - 5}
  {% endif %}

[gcode_macro _AFS_TIP]
description: Simple tip shaping so the filament leaves the hotend cleanly
gcode:
  M83
  G1 E2 F300
  G1 E-10 F3600
  G1 E6 F600
  G1 E-8 F3600
  G4 P1500
  G1 E-6 F600

[gcode_macro _AFS_UNLOAD_TOOLHEAD]
description: Pull the filament out of the direct-drive extruder (manual mode)
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  SAVE_GCODE_STATE NAME=afs_unload
  _AFS_TIP
  M83
  G1 E-{afs.unload_length} F1500
  M400
  RESTORE_GCODE_STATE NAME=afs_unload

[gcode_macro _AFS_PURGE]
description: Load the last centimetres slowly and purge the old colour
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% set purge = params.LENGTH|default(afs.purge_length)|float %}
  SAVE_GCODE_STATE NAME=afs_purge
  M83
  G1 E{purge} F240
  G1 E-0.8 F2100
  G4 P1000
  M400
  RESTORE_GCODE_STATE NAME=afs_purge

[gcode_macro AFS_CHANGE]
description: Switch the toolhead to another AFS slot. SLOT=n [TEMP=t] [FORCE=1]
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% set slot = params.SLOT|default(-1)|int %}
  {% set force = params.FORCE|default(0)|int %}
  {% set temp = params.TEMP|default(0)|float %}
  {% set printing = printer.print_stats.state == "printing" %}
  {% if slot < 0 or slot >= afs.slots %}
    { action_raise_error("AFS: Slot %d existiert nicht (1-%d)" % (slot + 1, afs.slots)) }
  {% endif %}
  {% if slot == afs.current and not force %}
    RESPOND MSG="AFS: Slot {slot + 1} ist bereits aktiv"
  {% elif afs.hardware %}
    # --- automatic change: keep the print running, come back to the same spot
    SAVE_GCODE_STATE NAME=afs_change
    _AFS_HEAT TEMP={temp}
    _ARTIFEX_PARK LIFT=2
    M117 AFS: wechsle zu Slot {slot + 1}
    _AFS_UNLOAD_HW
    _AFS_LOAD_HW SLOT={slot}
    _AFS_PURGE
    _AFS_SET_CURRENT SLOT={slot}
    RESTORE_GCODE_STATE NAME=afs_change MOVE=1 MOVE_SPEED=150
    M117 Druckt
  {% else %}
    # --- manual change: pause, unload, ask the user (ARTIFEX display / Mainsail prompt)
    {% if printing %}
      PAUSE
    {% else %}
      _ARTIFEX_PARK LIFT=10
    {% endif %}
    _AFS_HEAT TEMP={temp}
    {% if afs.current >= 0 or force %}
      _AFS_UNLOAD_TOOLHEAD
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=pending VALUE={slot}
    SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=resume_after_load VALUE={printing}
    M117 Bitte Slot {slot + 1} einlegen
    RESPOND TYPE=command MSG="action:prompt_begin ARTIFEX AFS"
    RESPOND TYPE=command MSG="action:prompt_text Bitte Filament aus Slot {slot + 1} einlegen und bis zum Extruder schieben."
    RESPOND TYPE=command MSG="action:prompt_footer_button Eingelegt|AFS_LOAD_CONFIRM|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro AFS_LOAD_CONFIRM]
description: Manual mode - filament for the pending slot has been inserted
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% if afs.pending < 0 %}
    RESPOND MSG="AFS: kein Filamentwechsel ausstehend"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _AFS_HEAT
    M117 Lade Filament
    SAVE_GCODE_STATE NAME=afs_load
    M83
    G1 E{afs.load_length} F600
    RESTORE_GCODE_STATE NAME=afs_load
    _AFS_PURGE
    _AFS_SET_CURRENT SLOT={afs.pending}
    SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=pending VALUE=-1
    {% if afs.resume_after_load and printer.pause_resume.is_paused %}
      SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=resume_after_load VALUE=False
      RESUME
    {% else %}
      M117 Slot {afs.pending + 1} geladen
    {% endif %}
  {% endif %}

[gcode_macro AFS_LOAD]
description: Load a slot into the toolhead. SLOT=n [TEMP=t]
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  {% set slot = params.SLOT|default(0)|int %}
  {% if afs.hardware %}
    _AFS_HEAT TEMP={params.TEMP|default(0)}
    _AFS_LOAD_HW SLOT={slot}
    _AFS_PURGE
    _AFS_SET_CURRENT SLOT={slot}
  {% else %}
    AFS_CHANGE SLOT={slot} TEMP={params.TEMP|default(0)} FORCE=1
  {% endif %}

[gcode_macro AFS_UNLOAD]
description: Unload the active filament. [TEMP=t]
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  _AFS_HEAT TEMP={params.TEMP|default(0)}
  {% if afs.hardware %}
    _AFS_UNLOAD_HW
  {% else %}
    _AFS_UNLOAD_TOOLHEAD
  {% endif %}
  _AFS_SET_CURRENT SLOT=-1
  M117 Filament entladen

[gcode_macro _AFS_SET_CURRENT]
gcode:
  {% set slot = params.SLOT|int %}
  SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=current VALUE={slot}
  SAVE_VARIABLE VARIABLE=afs_current VALUE={slot}

[gcode_macro _AFS_RUNOUT]
description: Filament ran out - guided reload of the same slot
gcode:
  {% set afs = printer["gcode_macro _AFS"] %}
  SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=pending VALUE={[afs.current, 0]|max}
  SET_GCODE_VARIABLE MACRO=_AFS VARIABLE=resume_after_load VALUE=True
  M117 Filament leer - bitte nachladen

# Placeholders - replaced by afs_hardware.cfg when motorised modules are installed.
[gcode_macro _AFS_UNLOAD_HW]
gcode:
  { action_raise_error("AFS hardware not configured (include afs_hardware.cfg)") }

[gcode_macro _AFS_LOAD_HW]
gcode:
  { action_raise_error("AFS hardware not configured (include afs_hardware.cfg)") }
