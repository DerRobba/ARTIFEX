# =============================================================================
#  Magnetic quick-swap toolhead
#
#  TOOL_CHANGE TOOL=<name>   cool down if needed, park at the front, ask the
#                            user to swap the magnetic tool
#  TOOL_CONFIRM              apply the offsets of the new tool
#  Offsets are relative to the reference tool "fdm" (E3D V6, 0.4 mm).
# =============================================================================

[gcode_macro _TOOLHEAD]
description: Tool table and state
variable_current: "fdm"
variable_pending: ""
variable_swap_x: 117.5
variable_swap_y: 10.0
variable_safe_temp: 60
variable_tools: {
    "fdm":   {"name": "E3D V6 0,4 mm", "x": 0.0, "y": 0.0, "z": 0.0, "nozzle": 0.4, "hot": True},
    "fdm06": {"name": "E3D V6 0,6 mm", "x": 0.0, "y": 0.0, "z": 0.0, "nozzle": 0.6, "hot": True},
    "laser": {"name": "Laser-Gravur",  "x": 0.0, "y": 22.0, "z": 30.0, "nozzle": 0.0, "hot": False},
    "pen":   {"name": "Stift-Plotter", "x": 0.0, "y": -18.0, "z": 0.0, "nozzle": 0.0, "hot": False}
  }
gcode:
  RESPOND MSG="Werkzeug: {current}"

[gcode_macro TOOL_CHANGE]
description: Prepare a magnetic tool swap. TOOL=fdm|fdm06|laser|pen
gcode:
  {% set th = printer["gcode_macro _TOOLHEAD"] %}
  {% set tool = params.TOOL|default("")|lower %}
  {% if tool not in th.tools %}
    { action_raise_error("Unbekanntes Werkzeug '%s' (verfügbar: %s)" % (tool, th.tools.keys()|join(", "))) }
  {% endif %}
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("Werkzeugwechsel während eines Drucks nicht erlaubt") }
  {% endif %}
  {% if tool == th.current %}
    RESPOND MSG="Werkzeug {tool} ist bereits aktiv"
  {% else %}
    M104 S0
    {% if printer.extruder.temperature > th.safe_temp %}
      M117 Werkzeug kühlt ab...
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={th.safe_temp}
    {% endif %}
    _ARTIFEX_PARK X={th.swap_x} Y={th.swap_y} LIFT=40
    SET_GCODE_VARIABLE MACRO=_TOOLHEAD VARIABLE=pending VALUE='"{tool}"'
    M117 Bitte Werkzeug {th.tools[tool].name} aufsetzen
    RESPOND TYPE=command MSG="action:prompt_begin ARTIFEX Werkzeug"
    RESPOND TYPE=command MSG="action:prompt_text Bitte den Werkzeugkopf '{th.tools[tool].name}' aufsetzen."
    RESPOND TYPE=command MSG="action:prompt_footer_button Aufgesetzt|TOOL_CONFIRM|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro TOOL_CONFIRM]
description: The new magnetic tool is attached - apply its offsets
gcode:
  {% set th = printer["gcode_macro _TOOLHEAD"] %}
  {% if th.pending == "" %}
    RESPOND MSG="Kein Werkzeugwechsel ausstehend"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _TOOLHEAD_RESTORE TOOL={th.pending}
    SAVE_VARIABLE VARIABLE=toolhead VALUE='"{th.pending}"'
    SET_GCODE_VARIABLE MACRO=_TOOLHEAD VARIABLE=pending VALUE='""'
    M117 Werkzeug {th.tools[th.pending].name} aktiv
  {% endif %}

[gcode_macro _TOOLHEAD_RESTORE]
gcode:
  {% set th = printer["gcode_macro _TOOLHEAD"] %}
  {% set tool = params.TOOL|default("fdm") %}
  {% if tool in th.tools %}
    {% set t = th.tools[tool] %}
    SET_GCODE_OFFSET X={t.x} Y={t.y} Z={t.z}
    SET_GCODE_VARIABLE MACRO=_TOOLHEAD VARIABLE=current VALUE='"{tool}"'
  {% endif %}
