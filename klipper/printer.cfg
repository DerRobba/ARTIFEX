# =============================================================================
#  ARTIFEX – Klipper configuration (entry point)
#  CoreXY · BTT SKR Pico · E3D V6 · Direct Drive · Ender-3 bed (Z only)
#
#  Copy this file to ~/printer_data/config/printer.cfg (the installer does it)
#  and keep the artifex/ folder next to it (installer symlinks it from the repo,
#  so updates through Moonraker's update manager arrive automatically).
#
#  Everything marked  >>> CALIBRATE <<<  must be checked on the real machine.
# =============================================================================

[include artifex/hardware.cfg]
[include artifex/z_switch.cfg]          # Z endstop switch – OR use probe.cfg below
[include artifex/macros.cfg]
[include artifex/afs.cfg]
[include artifex/toolhead.cfg]
[include artifex/filtration.cfg]

# --- optional modules: uncomment when the hardware is installed ---------------
# [include artifex/probe.cfg]           # BLTouch probe + bed mesh (remove z_switch.cfg then)
# [include artifex/afs_hardware.cfg]    # motorised AFS modules (second MCU)
# [include artifex/sensors.cfg]         # filament runout + toolhead presence

[mcu]
# Find yours with:  ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Klipper_rp2040_REPLACE_ME-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000            # >>> CALIBRATE <<< raise after input shaping
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 100

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[save_variables]
filename: ~/printer_data/config/artifex_variables.cfg

[display_status]
[pause_resume]
[exclude_object]
[respond]
[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 1800
gcode:
  TURN_OFF_HEATERS
  M84

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[temperature_sensor skr_pico]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90
