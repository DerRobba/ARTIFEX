# =============================================================================
#  ARTIFEX – Klipper entry point for the TEMPORARY Creality v4.2.2 board.
#  Copy to ~/printer_data/config/printer.cfg, set the serial and calibrate.
#  Replace by printer.cfg once the BTT SKR Pico is installed.
# =============================================================================

[include boards/creality-v4.2.2.cfg]
[include artifex/macros.cfg]
[include artifex/afs.cfg]
[include artifex/toolhead.cfg]
[include artifex/filtration_stub.cfg]

[mcu]
# Find yours with:  ls /dev/serial/by-id/*     (baud defaults to 250000)
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000            # >>> CALIBRATE <<<
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 100

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[save_variables]
filename: ~/printer_data/config/artifex_variables.cfg

[display_status]
[pause_resume]
[exclude_object]
[respond]
[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 1800
gcode:
  TURN_OFF_HEATERS
  M84

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[temperature_sensor board]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90
