# =============================================================================
#  ARTIFEX – TEMPORARY board config: Creality v4.2.2 (STM32F103, stock drivers)
#
#  Pins from Klipper's printer-creality-ender3-v2-2020.cfg. The board has no
#  UART drivers, no spare fan/LED ports and no second MCU, so the filter fan,
#  LED strip and motorised AFS are not available (see filtration_stub.cfg).
#
#  Klipper firmware (make menuconfig):
#    STM32 / STM32F103 / 28KiB bootloader offset / 8 MHz crystal /
#    Serial (on USART1 PA10/PA9)
#  >>> CHECK <<< motor directions and endstop sides on your CoreXY build
#                (add/remove "!" in front of dir_pin / endstop_pin).
# =============================================================================

# Stepper X = motor A, stepper Y = motor B (CoreXY)
[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 235          # >>> CALIBRATE <<< homes to X max (right)
position_min: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 5

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 235          # >>> CALIBRATE <<< homes to Y max (back)
position_min: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 5

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
position_endstop: 0            # >>> CALIBRATE <<<
position_min: -2
position_max: 250              # >>> CALIBRATE <<<
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 34.406      # >>> CALIBRATE <<< (direct drive 3:1 is ~22.68)
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_cross_section: 5
pressure_advance: 0.04         # >>> CALIBRATE <<<
heater_pin: PA1
sensor_pin: PC5
sensor_type: EPCOS 100K B57560G104F
control: pid                   # >>> CALIBRATE <<< PID_CALIBRATE HEATER=extruder TARGET=210
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 260
min_extrude_temp: 170

[heater_bed]
heater_pin: PA2
sensor_pin: PC4
sensor_type: EPCOS 100K B57560G104F
control: pid                   # >>> CALIBRATE <<< PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 120

[fan]                          # part cooling fan
pin: PA0

[force_move]
enable_force_move: True
